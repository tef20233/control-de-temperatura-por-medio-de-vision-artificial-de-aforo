models:
  yolov8n:
    filename: "yolov8n.pt"
    description: "Modelo nano, muy rápido, menor precisión"
    precision: 0.8859
    map50: 0.8859
    map50_95: 0.52
    fps_gtx1050ti: "90+"
    recommended: false
    status: "✅ Útil para pruebas de velocidad"

  yolov8s:
    filename: "yolov8s.pt"
    description: "Modelo small, buen balance velocidad/precisión"
    precision: 0.90
    map50: 0.8987
    map50_95: 0.52
    fps_gtx1050ti: "45-60"
    recommended: true
    status: "✅ Recomendado como modelo principal en este repo"

  yolov8m:
    filename: "yolov8m.pt"
    description: "Modelo medium, muy alta precisión, más lento"
    precision: 0.96
    map50: 0.962
    map50_95: 0.52
    fps_gtx1050ti: "20-30"
    recommended: false
    status: "⚠️ Usar solo si se prioriza precisión"

  yolov8l:
    filename: "yolov8l.pt"
    description: "Modelo large, máxima precisión, muy pesado"
    precision: 0.94
    map50: 0.9364
    map50_95: 0.50
    fps_gtx1050ti: "10-20"
    recommended: false
    status: "❌ No recomendado para tiempo real en 1050 Ti"

  yolov11n:
    filename: "yolov11n.pt"
    description: "YOLOv11 nano, máxima velocidad, precisión moderada"
    precision: 0.90
    map50: 0.91
    map50_95: 0.49
    fps_gtx1050ti: "100+"
    recommended: false
    status: "⚠️ Útil para demos de velocidad"

  yolov11s:
    filename: "yolov11s.pt"
    description: "YOLOv11 small entrenado por Julian, buen balance velocidad/precisión"
    precision: null
    map50: null
    map50_95: null
    fps_gtx1050ti: null
    recommended: false
    status: "🚧 Métricas por completar"

recommendations:
  production:
    model: "yolov8s"
    config: "balanced"

  edge_device:
    model: "yolov8s"
    config: "fast"

  max_speed:
    model: "yolov11s"
    config: "ultra_fast"

  max_accuracy:
    model: "yolov8m"
    config: "quality"
